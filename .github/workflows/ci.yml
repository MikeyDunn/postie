name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      # No AWS credentials needed: without domain context there are no
      # Route53 lookups, so the full stack synthesizes offline.
      - run: npx cdk synth --quiet
        working-directory: infra
